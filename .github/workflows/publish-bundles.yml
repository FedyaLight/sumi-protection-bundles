name: Publish Prepared Bundles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-prepared-bundles
  cancel-in-progress: false

jobs:
  build:
    name: Build, validate, and sign bundles
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # GitHub-maintained first-party actions are version-tagged for now; this workflow does not use third-party actions.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select OpenSSL 3
        run: |
          OPENSSL_BIN="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          if [ ! -x "${OPENSSL_BIN}" ]; then
            OPENSSL_BIN="$(command -v openssl)"
          fi
          echo "OPENSSL=${OPENSSL_BIN}" >> "${GITHUB_ENV}"
          "${OPENSSL_BIN}" version

      - name: Show tool versions
        run: |
          python3 --version
          cargo --version
          gh --version
          "${OPENSSL}" version

      - name: Run generator self-tests
        run: |
          python3 scripts/test_sumi_adblock_bundle.py
          python3 scripts/test_tracking_network_release.py
          python3 scripts/prepare_release_payload.py self-test
          python3 scripts/test_release_manifest_signature.py

      - name: Build prepared bundles
        run: |
          scripts/build_sumi_adblock_bundle.sh \
            --all-profiles \
            --refresh \
            --output .build/sumi-adblock-bundles

      - name: Verify prepared bundles
        run: |
          for bundle in .build/sumi-adblock-bundles/*/SumiAdblockBundle; do
            scripts/verify_sumi_adblock_bundle.sh "$bundle"
          done

      - name: Prepare release payload
        run: |
          python3 scripts/prepare_release_payload.py prepare \
            --bundles-root .build/sumi-adblock-bundles \
            --output dist \
            --repository-owner "${GITHUB_REPOSITORY_OWNER}" \
            --repository-name "${GITHUB_REPOSITORY#*/}"

      - name: Validate release payload
        run: |
          python3 scripts/prepare_release_payload.py validate \
            --release-assets dist/release-assets

      - name: Sign release manifest
        env:
          SUMI_PROTECTION_BUNDLE_ED25519_PRIVATE_KEY: ${{ secrets.SUMI_PROTECTION_BUNDLE_ED25519_PRIVATE_KEY }}
        run: |
          python3 scripts/sign_release_manifest.py \
            --manifest dist/release-assets/sumi-protection-bundles-release.json \
            --signature dist/release-assets/sumi-protection-bundles-release.json.sig \
            --key-id sumi-protection-bundles-ed25519-v1

      - name: Verify release manifest signature
        env:
          SUMI_PROTECTION_BUNDLE_ED25519_PRIVATE_KEY: ${{ secrets.SUMI_PROTECTION_BUNDLE_ED25519_PRIVATE_KEY }}
        run: |
          python3 scripts/verify_release_manifest_signature.py \
            --manifest dist/release-assets/sumi-protection-bundles-release.json \
            --signature dist/release-assets/sumi-protection-bundles-release.json.sig \
            --expected-key-id sumi-protection-bundles-ed25519-v1
          python3 scripts/prepare_release_payload.py refresh-checksums \
            --release-assets dist/release-assets
          python3 scripts/verify_release_manifest_signature.py \
            --manifest dist/release-assets/sumi-protection-bundles-release.json \
            --signature dist/release-assets/sumi-protection-bundles-release.json.sig \
            --expected-key-id sumi-protection-bundles-ed25519-v1

      - name: Upload CI inspection artifact
        uses: actions/upload-artifact@v7
        with:
          name: sumi-protection-bundles
          path: |
            .build/sumi-adblock-bundles
            dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed GitHub Release
    runs-on: macos-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # GitHub-maintained first-party actions are version-tagged for now; this workflow does not use third-party actions.
      - name: Download signed release payload
        uses: actions/download-artifact@v7
        with:
          name: sumi-protection-bundles

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat dist/release-version.txt)"
          TAG="bundles-${VERSION}"
          TITLE="Sumi protection bundles ${VERSION}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --title "${TITLE}" --notes-file dist/release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file dist/release-notes.md
          fi
